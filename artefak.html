    <!-- Main Content -->
    <div class="main-content">
        <header class="topbar">
            <h1>MODIVIM — Galeri Artefak</h1>
        </header>
        <div class="content-body">
            <div id="artifactContainer" class="artifact-grid">
                <!-- Data loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzCNmwFcb-Se7bP17O6XC73bpLuDUV0-ykXx9iS27-FSn0oG5ul1K2jUTJ4BsofQmz/exec?action=getArtefak";

        async function fetchArtifacts() {
            const container = document.getElementById('artifactContainer');
            try {
                const response = await fetch(GAS_API_URL);
                const result = await response.json();
                
                let data = [];
                if (Array.isArray(result)) {
                    data = result;
                } else if (result.data && Array.isArray(result.data)) {
                    data = result.data;
                } else if (result.items && Array.isArray(result.items)) {
                    data = result.items;
                } else if (result.artefak && Array.isArray(result.artefak)) {
                    data = result.artefak;
                }

                if (data.length === 0) {
                    container.innerHTML = '<p>Tidak ada artefak yang tersedia.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    
                    const imageUrl = item.gambar || item.foto || item.imageUrl || '';
                    const title = item.nama || item.judul || item.title || 'Contoh Artefak';
                    const category = item.kategori || item.keterangan || 'Islamisasi Indonesia';
                    const id = item.id || '#';

                    card.innerHTML = `
                        <div class="artifact-img-container">
                            ${imageUrl ? `<img src="${imageUrl}" alt="${title}">` : `<span>Foto tidak tersedia</span>`}
                        </div>
                        <div class="artifact-info">
                            <div>
                                <div class="artifact-title">${title}</div>
                                <div class="artifact-meta">${category}</div>
                            </div>
                            <a href="detail-artefak.html?id=${id}" class="btn-detail">Lihat Detail</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Gagal memuat artefak:', error);
                container.innerHTML = '<p>Gagal memuat data dari server.</p>';
            }
        }

        function handleLogout(event) {
            event.preventDefault();
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchArtifacts);
    </script>
</body>
</html>
