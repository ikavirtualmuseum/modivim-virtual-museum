<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Artefak — MODIVIM Virtual Museum</title>

  <!-- Font Utama: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==================================================
       DESIGN SYSTEM & VARIABLES (UNIFIED)
       ================================================== */
    :root {
      --color-eggshell: #fdfcfc;
      --color-warm-taupe: #f5f3f1;
      --color-stone: #ebe8e4;
      --color-ink: #000000;
      --color-graphite: #44403b;
      --color-smoke: #777169;
      --color-ash: #a59f97;
      --color-violet-spark: #0447ff;

      --font-main: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background-color: var(--color-eggshell);
      color: var(--color-smoke);
      font-family: var(--font-main);
      font-size: 15px;
      line-height: 1.6;
      display: flex;
    }

    h1, h2, h3 { color: var(--color-ink); font-weight: 300; letter-spacing: -0.02em; }
    .font-caption { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-ash); font-weight: 500; }

    /* LAYOUT & SIDEBAR */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--color-warm-taupe);
      border-right: 1px solid var(--color-stone);
      display: flex; flex-direction: column; justify-content: space-between;
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
      padding: 32px 24px; transition: transform 0.3s ease;
    }
    .sidebar-brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; margin-bottom: 40px; }
    .sidebar-brand-title { font-size: 20px; font-weight: 600; color: var(--color-ink); }
    .sidebar-brand-sub { font-size: 11px; color: var(--color-ash); text-transform: uppercase; letter-spacing: 0.06em; }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .sidebar-link {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-radius: 10px; color: var(--color-smoke); text-decoration: none; font-size: 14px; transition: all 0.2s ease;
    }
    .sidebar-link svg { width: 18px; height: 18px; stroke: var(--color-smoke); stroke-width: 1.75; fill: none; }
    .sidebar-link:hover, .sidebar-link.active { color: var(--color-ink); background-color: var(--color-eggshell); font-weight: 500; }
    .sidebar-link:hover svg, .sidebar-link.active svg { stroke: var(--color-ink); }

    .sidebar-footer { border-top: 1px solid var(--color-stone); padding-top: 20px; }
    .btn-logout {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px;
      border: none; background: transparent; color: var(--color-graphite); font-size: 14px; cursor: pointer; border-radius: 10px; transition: all 0.2s ease;
    }
    .btn-logout svg { width: 18px; height: 18px; stroke: var(--color-graphite); stroke-width: 1.75; fill: none; }
    .btn-logout:hover { background-color: rgba(220, 38, 38, 0.08); color: #dc2626; }
    .btn-logout:hover svg { stroke: #dc2626; }

    .main-wrapper {
      margin-left: var(--sidebar-width); flex-grow: 1; min-height: 100vh;
      display: flex; flex-direction: column; background-color: var(--color-eggshell); width: calc(100% - var(--sidebar-width));
    }
    .top-header {
      padding: 24px 48px; border-bottom: 1px solid var(--color-stone); display: flex;
      align-items: center; justify-content: space-between; background-color: var(--color-eggshell); position: sticky; top: 0; z-index: 90;
    }
    .content-body { padding: 40px 48px; display: flex; flex-direction: column; gap: 32px; flex-grow: 1; }

    /* GALERI ARTEFAK CARD */
    .artifact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .artifact-card {
      background-color: var(--color-warm-taupe);
      border: 1px solid var(--color-stone);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .artifact-card:hover {
      border-color: var(--color-ash);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    .card-img-wrap {
      width: 100%;
      height: 200px;
      background-color: var(--color-stone);
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-ink);
      line-height: 1.3;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--color-smoke);
      margin-bottom: 8px;
    }

    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-weight: 500; cursor: pointer; border: none; transition: background 0.2s; }
    .btn-primary { background-color: var(--color-ink); color: #fff; }
    .btn-primary:hover { background-color: var(--color-graphite); }

    .btn-detail {
      margin-top: auto;
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
    }

    .loading-text {
      text-align: center;
      padding: 40px;
      color: var(--color-smoke);
    }

    /* MODAL STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99999;
    }

    .modal-overlay.active { display: flex; }

    .modal-container {
      position: relative;
      width: 100%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--color-eggshell);
      border-radius: 20px;
      border: 1px solid var(--color-stone);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--color-stone);
      background: var(--color-warm-taupe);
      color: var(--color-ink);
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }

    .modal-close-btn:hover { background: var(--color-stone); }

    .modal-body { padding: 36px; }

    .modal-header-image {
      width: 100%;
      height: 320px;
      background: var(--color-warm-taupe);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-stone);
    }

    .modal-img { width: 100%; height: 100%; object-fit: contain; }

    .modal-title { font-size: 24px; color: var(--color-ink); font-weight: 500; margin-bottom: 20px; }

    .modal-grid-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      background: var(--color-warm-taupe);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--color-stone);
      margin-bottom: 24px;
    }

    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-ash); font-weight: 600; }
    .info-value { color: var(--color-ink); font-weight: 500; font-size: 14px; }

    .modal-section { margin-bottom: 24px; }
    .modal-section h3 { color: var(--color-ink); font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--color-stone); padding-bottom: 8px; margin-bottom: 12px; }
    .modal-section p { line-height: 1.6; color: var(--color-graphite); font-size: 14.5px; }

    .placeholder-box {
      background: var(--color-warm-taupe);
      border: 1px solid var(--color-stone);
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
    }

    .footer { padding: 32px 48px; border-top: 1px solid var(--color-stone); display: flex; justify-content: space-between; font-size: 13px; color: var(--color-ash); margin-top: auto; }
    .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.3); z-index: 95; }
    .mobile-nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; color: var(--color-ink); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .main-wrapper { margin-left: 0; width: 100%; }
      .mobile-nav-toggle { display: block; }
      .content-body, .top-header, .footer { padding: 20px; }
      .modal-body { padding: 20px; }
      .modal-header-image { height: 220px; }
      .modal-grid-info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <div>
      <a href="dashboard-mahasiswa.html" class="sidebar-brand">
        <span class="sidebar-brand-title">MODIVIM</span>

      </a>

      <ul class="sidebar-menu">
        <li>
          <a href="dashboard-mahasiswa.html" class="sidebar-link">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>

    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logoutUser()">

        <span>Keluar</span>
      </button>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <header class="top-header">
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Buka Menu Navigasi">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
          </svg>
        </button>
        <div>
          <span class="font-caption">PEMBELAJARAN SEJARAH ISLAM</span>
          <h1 style="font-size: 18px; font-weight: 500;" id="userHeaderName">Mahasiswa</h1>
        </div>
      </div>
    </header>

    <main class="content-body">
      <div>
        <span class="font-caption" style="color: var(--color-violet-spark);">EKSPLORASI KOLEKSI</span>
        <h2 style="font-size: 28px; margin-top: 4px;">Galeri Artefak Sejarah</h2>
      </div>

      <div id="loading" class="loading-text">
        Memuat data artefak dari server...
      </div>
      <div id="artifactGrid" class="artifact-grid"></div>
    </main>

    <footer class="footer">
      <div><strong style="color: var(--color-ink);">MODIVIM</strong> — Virtual Museum Sejarah Islam</div>
      <div>Universitas Negeri Medan &bull; &copy; <span id="year"></span></div>
    </footer>
  </div>

  <!-- MODAL DETAIL ARTEFAK -->
  <div id="artifactModalOverlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-container" role="dialog" aria-modal="true">
      <button id="modalCloseButton" class="modal-close-btn" type="button" aria-label="Tutup modal">
        &times;
      </button>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    const GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbyzCNmwFcb-Se7bP17O6XC73bpLuDUV0-ykXx9iS27-FSn0oG5ul1K2jUTJ4BsofQmz/exec";
    const mockUser = { nama: "Mahasiswa", mahasiswaId: "M001" };

    let allArtifacts = [];

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById('year').textContent = new Date().getFullYear();
      setupMobileSidebar();
      loadUserProfile();
      fetchArtifacts();

      document.getElementById("modalCloseButton").addEventListener("click", closeArtifactModal);

      document.getElementById("artifactModalOverlay").addEventListener("click", function(event) {
        if (event.target === this) {
          closeArtifactModal();
        }
      });
    });

    function setupMobileSidebar() {
      const toggle = document.getElementById('mobileNavToggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (toggle && sidebar && overlay) {
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        });
      }
    }

    function loadUserProfile() {
      const user = JSON.parse(sessionStorage.getItem('modivim_user')) || mockUser;
      document.getElementById('userHeaderName').textContent = user.nama || user.name || "Mahasiswa";
    }

    /* FUNGSI FETCH ARTEFAK BESERTA PERTANYAAN PEMANTIK DARI GAS */
    function fetchArtifacts() {
      fetch(GAS_BASE_URL + "?action=getArtefak", {
        method: "GET",
        redirect: "follow"
      })
        .then(function(response) {
          if (!response.ok) {
            throw new Error("HTTP Error " + response.status);
          }
          return response.json();
        })
        .then(function(result) {
          document.getElementById("loading").style.display = "none";
          if (result.success && Array.isArray(result.data)) {
            allArtifacts = result.data;
            renderGallery(allArtifacts);
            
            setTimeout(function() {
              checkUrlParamAndOpenModal();
            }, 50);
          } else {
            showError("Data artefak tidak tersedia.");
          }
        })
        .catch(function(error) {
          console.error("GAS ERROR:", error);
          showError("Koleksi artefak belum dapat dimuat.");
        });
    }

    function renderGallery(artifacts) {
      const grid = document.getElementById("artifactGrid");
      grid.innerHTML = "";

      if (!artifacts.length) {
        grid.innerHTML = "<p>Belum ada artefak yang tersedia.</p>";
        return;
      }

      artifacts.forEach(function(item) {
        const card = document.createElement("div");
        card.className = "artifact-card";

        const foto = item.FotoURL && item.FotoURL !== "-" ? item.FotoURL : "";

        const imageHTML = foto
          ? `<img src="${escapeHTML(foto)}" alt="${escapeHTML(item.NamaArtefak || "Artefak")}" class="card-img" onerror="this.style.display='none'">`
          : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--color-ash); font-size:13px;">Foto tidak tersedia</div>`;

        card.innerHTML = `
          <div class="card-img-wrap">
            ${imageHTML}
          </div>
          <div class="card-body">
            <h3 class="card-title">
              ${escapeHTML(item.NamaArtefak || "Tanpa Nama")}
            </h3>
            <div class="card-subtitle">
              ${escapeHTML(item.Lokasi || "-")} &bull; ${escapeHTML(item.Periode || "-")}
            </div>
            <button class="btn btn-primary btn-detail" type="button">
              Lihat Detail
            </button>
          </div>
        `;

        const button = card.querySelector(".btn-detail");
        button.addEventListener("click", function() {
          openArtifactModal(item.ArtefakID);
        });

        grid.appendChild(card);
      });
    }

    /* FUNGSI PEMBUKA MODAL */
    function openArtifactModal(artifactId) {
      if (!artifactId) return;

      const targetIdStr = String(artifactId).trim().toLowerCase();

      const artifact = allArtifacts.find(function(item) {
        return item && item.ArtefakID && String(item.ArtefakID).trim().toLowerCase() === targetIdStr;
      });

      if (!artifact) {
        console.warn("Artefak tidak ditemukan untuk ID:", artifactId);
        return;
      }

      renderArtifactDetail(artifact);

      const overlay = document.getElementById("artifactModalOverlay");
      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeArtifactModal() {
      const overlay = document.getElementById("artifactModalOverlay");
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeArtifactModal();
      }
    });

    /* RENDER DETAIL MODAL & DOKUMEN JAWABAN DESKRIPSI UTUH */
    function renderArtifactDetail(artifact) {
      const modalBody = document.getElementById("modalBody");
      const foto = artifact.FotoURL && artifact.FotoURL !== "-" ? artifact.FotoURL : "";
      const tahunAbad = artifact.TahunAbad || artifact["Tahun/Abad"] || "-";

      const currentUrl = window.location.origin + window.location.pathname + "?id=" + artifact.ArtefakID;
      const qrCodeUrl = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(currentUrl);

      // 1. Dapatkan daftar pertanyaan pemantik dari backend
      const listPertanyaan = artifact.DaftarPertanyaan || [];
      let htmlPertanyaanList = "";

      if (Array.isArray(listPertanyaan) && listPertanyaan.length > 0) {
        htmlPertanyaanList = "<ol style='padding-left: 20px; margin-bottom: 16px; color: var(--color-graphite); font-size: 13.5px; line-height: 1.6;'>";
        listPertanyaan.forEach((q) => {
          htmlPertanyaanList += `<li style='margin-bottom: 8px;'>${escapeHTML(q.teksPertanyaan)}</li>`;
        });
        htmlPertanyaanList += "</ol>";
      } else {
        // Fallback pertanyaan kritis jika belum diisi di sheet PERTANYAAN
        htmlPertanyaanList = `
          <ul style="margin: 0 0 16px 0; padding-left: 20px; color: var(--color-smoke); line-height: 1.6; font-size: 13.5px;">
            <li>Bagaimana bentuk akulturasi budaya yang tercermin dari struktur atau corak fisik artefak ini?</li>
            <li>Peran strategis apa yang dimainkan oleh artefak ini dalam dinamika sejarah Islam di wilayah ${escapeHTML(artifact.Lokasi || "terkait")}?</li>
            <li>Bukti empiris apa saja yang menunjukkan keaslian dan signifikansi historis artefak tersebut?</li>
          </ul>`;
      }

      // Ambil jawaban dari penyimpanan lokal jika pernah diisi sebelumnya
      const savedAnswerKey = "modivim_answer_" + artifact.ArtefakID;
      const existingAnswer = localStorage.getItem(savedAnswerKey) || "";
      const defaultPertanyaanId = (listPertanyaan.length > 0 && listPertanyaan[0].pertanyaanId) ? listPertanyaan[0].pertanyaanId : "Q001";

      modalBody.innerHTML = `
        <div class="modal-header-image">
          ${foto ? `<img src="${escapeHTML(foto)}" alt="${escapeHTML(artifact.NamaArtefak || "Artefak")}" class="modal-img">` : `<span style="color:var(--color-ash); font-size:13px;">Foto artefak tidak tersedia</span>`}
        </div>

        <h2 class="modal-title">
          ${escapeHTML(artifact.NamaArtefak || "Nama Artefak Tidak Tersedia")}
        </h2>

        <div class="modal-grid-info">
          ${createInfo("Artefak ID", artifact.ArtefakID)}
          ${createInfo("Periode", artifact.Periode)}
          ${createInfo("Tahun / Abad", tahunAbad)}
          ${createInfo("Jenis Artefak", artifact.JenisArtefak)}
          ${createInfo("Lokasi", artifact.Lokasi)}
          ${createInfo("Provinsi / Pulau", (artifact.Provinsi || "-") + " / " + (artifact.Pulau || "-"))}
        </div>

        <div class="modal-section">
          <h3>Deskripsi Artefak</h3>
          <p>${escapeHTML(artifact.Deskripsi || "Tidak ada deskripsi.")}</p>
        </div>

        <div class="modal-section">
          <h3>Nilai Historis</h3>
          <p>${escapeHTML(artifact.NilaiHistoris || "Tidak ada catatan nilai historis.")}</p>
        </div>

        <!-- QR CODE ARTEFAK -->
        <div class="placeholder-box" style="background: var(--color-eggshell); text-align: center;">
          <h4 style="color: var(--color-ink); font-weight:600; font-size: 15px; margin-bottom: 12px;">QR CODE ARTEFAK</h4>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <img src="${qrCodeUrl}" alt="QR Code ${escapeHTML(artifact.NamaArtefak)}" style="width: 140px; height: 140px; border-radius: 12px; padding: 6px; background: #fff; border: 1px solid var(--color-stone);">
            <p style="font-size: 13px; color: var(--color-smoke); margin: 0;">Scan untuk membagikan atau membuka langsung artefak ini.</p>
          </div>
        </div>

        <!-- KOTAK PERTANYAAN HISTORIS & DESKRIPSI JAWABAN MAHASISWA -->
        <div class="placeholder-box">
          <h4 style="color: var(--color-violet-spark); margin-bottom: 10px; font-size: 15px; font-weight:600;">
            Lembar Kerja / Pertanyaan Pemantik (Discovery Learning)
          </h4>
          <p style="font-weight: 500; color: var(--color-ink); margin-bottom: 12px; font-size: 14px;">
            Berdasarkan pengamatan Anda terhadap artefak <strong>${escapeHTML(artifact.NamaArtefak)}</strong>, jawablah pertanyaan-pertanyaan berikut dalam bentuk deskripsi analisis utuh:
          </p>

          <!-- LIST PERTANYAAN DARI BACKEND -->
          ${htmlPertanyaanList}

          <div style="margin-top: 16px;">
            <label for="studentAnswerInput" style="display: block; font-weight: 600; font-size: 13.5px; color: var(--color-ink); margin-bottom: 6px;">
              Deskripsi Jawaban & Analisis Mahasiswa:
            </label>
            <textarea 
              id="studentAnswerInput" 
              rows="6" 
              style="width: 100%; padding: 12px; border: 1px solid var(--color-stone); border-radius: 8px; font-family: var(--font-main); font-size: 13.5px; background: #fff; color: var(--color-graphite); resize: vertical; line-height: 1.5;" 
              placeholder="Tuliskan deskripsi analisis kritis-historis Anda di sini..."
            >${escapeHTML(existingAnswer)}</textarea>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
              <button 
                type="button" 
                id="btnSaveAnswer" 
                class="btn btn-primary"
                style="padding: 10px 20px; font-size: 13px;"
              >
                Simpan Jawaban
              </button>
              <span id="saveStatus" style="font-size: 12px; color: #065f46; font-weight: 500; display: none;">Jawaban tersimpan!</span>
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
          <button type="button" class="btn btn-primary" id="modalBottomClose" style="padding: 8px 20px; font-size: 13px;">
            Tutup
          </button>
        </div>
      `;

      // Event Listener Tombol Simpan
      const btnSave = document.getElementById("btnSaveAnswer");
      if (btnSave) {
        btnSave.addEventListener("click", function() {
          const answerInput = document.getElementById("studentAnswerInput");
          const answerText = answerInput ? answerInput.value.trim() : "";

          if (!answerText) {
            alert("Mohon tuliskan deskripsi jawaban Anda terlebih dahulu.");
            return;
          }

          const user = JSON.parse(sessionStorage.getItem('modivim_user')) || mockUser;
          const mahasiswaId = user.mahasiswaId || user.userID || user.username || "M001";

          // Backup Jawaban di Browser
          localStorage.setItem(savedAnswerKey, answerText);

          const statusSpan = document.getElementById("saveStatus");
          statusSpan.innerText = "Menyimpan ke database...";
          statusSpan.style.color = "var(--color-violet-spark)";
          statusSpan.style.display = "inline";

          // Kirim POST ke GAS
          fetch(GAS_BASE_URL, {
            method: "POST",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: "submitAnswer",
              artefakId: artifact.ArtefakID,
              mahasiswaId: mahasiswaId,
              pertanyaanId: defaultPertanyaanId,
              jawaban: answerText
            })
          })
          .then(response => response.json())
          .then(result => {
            if (result.success) {
              statusSpan.innerText = "Jawaban deskripsi berhasil disimpan!";
              statusSpan.style.color = "#065f46";
            } else {
              statusSpan.innerText = "Gagal: " + (result.message || "Terjadi kesalahan");
              statusSpan.style.color = "#dc2626";
            }
            setTimeout(function() {
              statusSpan.style.display = "none";
            }, 3500);
          })
          .catch(function(error) {
            console.error("Gagal menyimpan:", error);
            statusSpan.innerText = "Tersimpan secara lokal (Offline mode)";
            statusSpan.style.color = "#065f46";
            setTimeout(function() {
              statusSpan.style.display = "none";
            }, 3500);
          });
        });
      }

      document.getElementById("modalBottomClose").addEventListener("click", closeArtifactModal);
    }

    function createInfo(label, value) {
      return `
        <div class="info-item">
          <span class="info-label">${escapeHTML(label)}</span>
          <span class="info-value">${escapeHTML(value || "-")}</span>
        </div>
      `;
    }

    function checkUrlParamAndOpenModal() {
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get("id");
      if (targetId) {
        openArtifactModal(targetId);
      }
    }

    function showError(message) {
      const loading = document.getElementById("loading");
      loading.innerText = message;
      loading.style.display = "block";
    }

    function escapeHTML(value) {
      if (value === null || value === undefined) {
        return "";
      }
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function logoutUser() {
      if (confirm("Apakah Anda yakin ingin keluar dari MODIVIM?")) {
        sessionStorage.clear();
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
